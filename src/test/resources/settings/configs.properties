# ============================================================
# NHIMS Test Framework Configuration
# ============================================================

# Environment to load: staging | production | nightlight
# Determines which environment-specific properties file is used for URLs and credentials
environment = staging

# Browser to use for test execution: Chrome | Firefox | Edge (case-insensitive)
driver = Chrome

# Enable Allure HTML report generation: true | false
report = false

# Capture screenshot after each test (pass or fail): true | false
capture = true

# Record video of test execution (not supported on macOS): true | false
video = false

# Enable console and file logging: true | false
logger = true
